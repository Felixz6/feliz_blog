<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6e6e1">
  <title>访客留言 // MESSAGE PAYLOAD</title>
  <style>
    :root { color-scheme: light; --bg:#e6e6e1; --paper:#f7f7f3; --ink:#111214; --muted:#55575c; --line:#c9c9c2; --yellow:#ffe100; --field:#fff; --grid:rgba(17,18,20,.06); }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background-color:var(--bg); background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:40px 40px; }
    .shell { width:min(960px,calc(100% - 32px)); margin:clamp(24px,7vh,72px) auto; }
    .back { display:inline-flex; margin-bottom:12px; color:var(--muted); font:600 12px ui-monospace,SFMono-Regular,monospace; letter-spacing:.08em; text-decoration:none; }
    .back:hover,.back:focus-visible { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
    .panel { overflow:hidden; background:var(--paper); border:1px solid var(--line); box-shadow:8px 8px 0 rgba(17,18,20,.08); }
    .ph { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); }
    .ph h1 { display:flex; align-items:center; gap:14px; margin:0; font-size:clamp(17px,3vw,22px); letter-spacing:.12em; }
    .n { display:grid; place-items:center; width:48px; height:36px; background:var(--yellow); font:800 18px ui-monospace,SFMono-Regular,monospace; }
    .ph small,.label,.template-label,.hint { color:var(--muted); font:600 12px ui-monospace,SFMono-Regular,monospace; letter-spacing:.14em; }
    .pb { padding:clamp(18px,4vw,36px); }
    .field label,.label { display:block; margin-bottom:10px; }
    input[type="text"],textarea { width:100%; color:var(--ink); background:var(--field); border:1px solid var(--line); border-left:5px solid var(--line); border-radius:0; font:500 16px/1.6 system-ui,sans-serif; }
    input[type="text"] { min-height:56px; padding:12px 16px; }
    textarea { display:block; min-height:clamp(240px,42vh,440px); padding:16px; resize:vertical; }
    input:focus-visible,textarea:focus-visible,button:focus-visible,.attach:focus-within { outline:3px solid #c33e74; outline-offset:2px; }
    .templates { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:18px 0; }
    .template-label { margin-right:4px; }
    .templates button,.tab,.attach { min-height:40px; padding:7px 14px; color:var(--ink); background:transparent; border:1px solid var(--ink); font:600 14px system-ui,sans-serif; cursor:pointer; }
    .templates button:hover,.attach:hover { color:var(--paper); background:var(--ink); }
    .tabs { display:flex; margin-bottom:12px; }
    .tab { min-width:116px; font:700 13px ui-monospace,SFMono-Regular,monospace; letter-spacing:.12em; }
    .tab + .tab { border-left:0; }
    .tab[aria-pressed="true"] { color:var(--paper); background:var(--ink); }
    .attachment-row { display:flex; align-items:center; flex-wrap:wrap; gap:10px; min-height:52px; margin-top:14px; }
    .attach { display:inline-flex; align-items:center; gap:8px; letter-spacing:.08em; }
    .attach input { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    .files { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
    .send { display:flex; width:100%; min-height:58px; margin-top:12px; padding:0; color:var(--ink); background:var(--yellow); border:0; cursor:pointer; clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px)); }
    .send:hover { filter:brightness(.96); }
    .stripe { width:32px; background:repeating-linear-gradient(-45deg,var(--ink) 0 6px,var(--yellow) 6px 12px); }
    .send-label { flex:1; display:flex; align-items:center; justify-content:center; gap:12px; font-weight:800; letter-spacing:.22em; }
    .send-label small { font:600 11px ui-monospace,SFMono-Regular,monospace; letter-spacing:.12em; opacity:.7; }
    .arrow { display:grid; place-items:center; width:48px; font:700 14px ui-monospace,SFMono-Regular,monospace; }
    .hint { margin:10px 0 0; letter-spacing:.04em; }
    .status { min-height:1.5em; margin:12px 0 0; color:#8b3b26; font-size:14px; }
    .send:disabled { cursor:wait; opacity:.65; }
    .honeypot { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    @media (max-width:560px) { .shell { width:min(100% - 18px,960px); margin:18px auto; } .ph { padding:12px; } .pb { padding:16px 12px; } .templates { gap:6px; } .templates button { padding-inline:10px; } .tab { flex:1; min-width:0; } }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="/about/">← 返回 ME</a>
    <section class="panel" aria-labelledby="payload-title">
      <header class="ph"><h1 id="payload-title"><span class="n">03</span>留言编写</h1><small>MESSAGE PAYLOAD</small></header>
      <form class="pb" id="message-form">
        <div class="field"><label class="label" for="subject">主题 SUBJECT</label><input type="text" id="subject" name="subject" maxlength="120" value="访客留言" placeholder="留言主题" required></div>
        <div class="honeypot" aria-hidden="true"><label for="website">留空</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
        <div class="templates" aria-label="预设模板"><span class="template-label">预设模板 //</span><button type="button" data-subject="想和你交流一下" data-body="你好！&#10;&#10;我想和你聊聊：">交流</button><button type="button" data-subject="关于博客的一点反馈" data-body="你好！&#10;&#10;我想反馈：">反馈</button><button type="button" data-subject="来自博客访客的留言" data-body="你好！&#10;&#10;">纯文本</button></div>
        <input type="hidden" id="mode" name="mode" value="text">
        <div class="tabs" role="group" aria-label="正文格式"><button class="tab" type="button" data-mode="html" aria-pressed="false">HTML</button><button class="tab" type="button" data-mode="text" aria-pressed="true">TEXT</button></div>
        <label class="label" for="body">正文 BODY</label><textarea id="body" name="body" maxlength="10000" placeholder="在此编写留言正文…" required></textarea>
        <div class="attachment-row"><label class="attach">＋ 添加附件<input type="file" id="attachments" multiple></label><span class="files" id="file-names" aria-live="polite">尚未选择附件</span></div>
        <button class="send" type="submit"><span class="stripe" aria-hidden="true"></span><span class="send-label">发送留言 <small>SUBMIT</small></span><span class="arrow" aria-hidden="true">▶▶</span></button>
        <p class="hint">留言将发送给站长；API Key 不会暴露在浏览器中。单个附件最多 3 MB（最多 3 个）。</p>
        <p class="status" id="send-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector("#message-form");
    const subject = document.querySelector("#subject");
    const body = document.querySelector("#body");
    const mode = document.querySelector("#mode");
    const status = document.querySelector("#send-status");
    const templates = document.querySelectorAll(".templates button");
    const tabs = document.querySelectorAll(".tab");
    const attachments = document.querySelector("#attachments");
    const fileNames = document.querySelector("#file-names");
    templates.forEach((button) => button.addEventListener("click", () => { subject.value = button.dataset.subject; body.value = button.dataset.body; body.focus(); }));
    tabs.forEach((button) => button.addEventListener("click", () => { mode.value = button.dataset.mode; tabs.forEach((tab) => tab.setAttribute("aria-pressed", String(tab === button))); }));
    const sendButton = form.querySelector(".send");
    const encodeBase64 = async (file) => {
      const bytes = new Uint8Array(await file.arrayBuffer());
      let binary = "";
      for (let offset = 0; offset < bytes.length; offset += 0x8000) binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
      return { filename: file.name, content: btoa(binary) };
    };
    attachments.addEventListener("change", () => { fileNames.textContent = attachments.files.length ? Array.from(attachments.files, (file) => file.name).join("、") : "尚未选择附件"; });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const files = Array.from(attachments.files);
      if (files.length > 3 || files.reduce((sum, file) => sum + file.size, 0) > 3 * 1024 * 1024) { status.textContent = "最多添加 3 个附件，合计不超过 3 MB。"; return; }
      sendButton.disabled = true;
      status.textContent = "正在发送留言…";
      try {
        const response = await fetch("/api/message", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ subject: subject.value, body: body.value, mode: mode.value, website: form.elements.website.value, attachments: await Promise.all(files.map(encodeBase64)) }) });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || "发送失败，请稍后重试。");
        status.textContent = "留言已发送，谢谢！";
        form.reset();
        mode.value = "text";
        tabs.forEach((tab) => tab.setAttribute("aria-pressed", String(tab.dataset.mode === "text")));
        fileNames.textContent = "尚未选择附件";
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "发送失败，请稍后重试。";
      } finally { sendButton.disabled = false; }
    });
  </script>
</body>
</html>
